<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<title>Critbot — Team Crits</title>
<style>
  :root { font-family: Inter, -apple-system, system-ui, sans-serif; }
  body { margin: 0; background: #0f1115; color: #e6e9ef; }
  .wrap { max-width: 900px; margin: 0 auto; padding: 24px 20px 60px; }
  header { display: flex; align-items: baseline; gap: 14px; margin-bottom: 4px; }
  h1 { font-size: 20px; margin: 0; }
  .sub { color: #8b93a3; font-size: 13px; }
  a { color: #6aa3f0; text-decoration: none; }
  .bar { display: flex; align-items: center; gap: 10px; margin: 14px 0 18px; font-size: 13px; }
  .seg { display: inline-flex; border: 1px solid #2a2f3a; border-radius: 8px; overflow: hidden; }
  .seg button { background: #161a22; color: #cbd2de; border: 0; padding: 6px 12px; cursor: pointer; font-size: 12px; }
  .seg button.on { background: #2c6cd6; color: #fff; }
  .card { display: block; width: 100%; text-align: left; background: #161a22; border: 1px solid #232936; border-radius: 12px; padding: 14px 16px; margin-bottom: 10px; cursor: pointer; color: inherit; }
  .card:hover { border-color: #2c6cd6; }
  .row1 { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
  .title { font-size: 15px; font-weight: 600; }
  .pill { font-size: 10px; padding: 2px 7px; border-radius: 999px; background: #222836; color: #aab2c0; }
  .pill.team { background: #1c2b22; color: #7fd0a3; }
  .pill.lens { background: #1d2436; color: #8fb4f5; }
  .pill.miss { background: #2b1f24; color: #e08aa0; }
  .pill.good { background: #14271c; color: #6fd29a; }
  .meta { color: #8b93a3; font-size: 12px; margin-top: 6px; }
  #detail { margin-top: 8px; }
  .back { font-size: 13px; cursor: pointer; color: #6aa3f0; display: inline-block; margin-bottom: 10px; }
  .panel { background: #161a22; border: 1px solid #232936; border-radius: 12px; padding: 14px 16px; margin-bottom: 12px; }
  .panel h2 { font-size: 12px; letter-spacing: .04em; text-transform: uppercase; color: #8b93a3; margin: 0 0 10px; }
  .sc { font-size: 13px; margin: 3px 0; }
  .ai { font-size: 13px; border-left: 3px solid #2c6cd6; padding: 4px 10px; margin: 6px 0; }
  .tx { font-size: 13px; margin: 4px 0; color: #cbd2de; }
  .tx .who { color: #8fb4f5; }
  .empty { color: #6f7787; font-size: 13px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Team Crits</h1>
    <span class="sub" id="sub"></span>
    <span style="margin-left:auto"><a href="/live/">← Live Critique</a></span>
  </header>

  <div id="list-view">
    <div class="bar">
      <span class="sub">View:</span>
      <span class="seg">
        <button id="f-all" class="on">All crits</button>
        <button id="f-mine">Crits I was in</button>
      </span>
      <span class="sub" id="count"></span>
    </div>
    <div id="list"><div class="empty">Loading…</div></div>
  </div>

  <div id="detail" style="display:none"></div>
</div>

<script>
  const $ = (id) => document.getElementById(id);
  let ALL = [], filter = "all", cfg = {};

  function pill(text, cls) { return `<span class="pill ${cls || ""}">${text}</span>`; }
  function date(s) { try { return new Date(s).toLocaleDateString([], { month: "short", day: "numeric" }); } catch (_) { return ""; } }
  function downloadJson(rec) {
    const blob = new Blob([JSON.stringify(rec, null, 2)], { type: "application/json" });
    const a = document.createElement("a"); a.href = URL.createObjectURL(blob);
    a.download = (rec.id || "crit") + ".json"; document.body.appendChild(a); a.click();
    setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
  }

  async function loadList() {
    let data; try { data = await (await fetch("/api/sessions")).json(); } catch (e) { $("list").innerHTML = '<div class="empty">Relay not reachable.</div>'; return; }
    ALL = data.sessions || []; cfg = data.config || {};
    $("sub").textContent = cfg.user ? "as " + cfg.user + (cfg.hasToken ? " · shared via GitHub" : " · local + seed") : "";
    render();
  }

  function render() {
    const rows = ALL.filter((s) => filter === "all" || s.youAttended);
    $("count").textContent = rows.length + " of " + ALL.length + " crit" + (ALL.length === 1 ? "" : "s");
    if (!rows.length) { $("list").innerHTML = '<div class="empty">No crits in this view yet.</div>'; return; }
    $("list").innerHTML = rows.map((s) => {
      const q = s.quality ? pill(s.quality.met + "/" + s.quality.of + " quality", s.quality.met === s.quality.of ? "good" : "") : "";
      const mine = s.youAttended ? "" : pill("you didn't attend", "miss");
      return `<button class="card" data-id="${s.id}">
        <div class="row1"><span class="title">${s.title}</span>${s.team ? pill(s.team, "team") : ""}${s.lens ? pill(s.lens, "lens") : ""}${q}${mine}</div>
        <div class="meta">${date(s.startedAt)} · ${s.participants.join(", ")} · ${s.actionItems} action item${s.actionItems === 1 ? "" : "s"} · ${s.source}</div>
      </button>`;
    }).join("");
    [...document.querySelectorAll(".card")].forEach((el) => el.onclick = () => openRecord(el.getAttribute("data-id")));
  }

  async function openRecord(id) {
    let data; try { data = await (await fetch("/api/sessions/" + encodeURIComponent(id))).json(); } catch (e) { return; }
    const r = data.record; if (!r) return;
    const m = r.meta || {};
    const sc = (r.scorecard || []).map((s) => `<div class="sc">${s.met ? "✅" : "⬜️"} <b>${s.label}</b> — ${s.note || ""}</div>`).join("") || '<div class="empty">No scorecard.</div>';
    const ai = (r.actionItems || []).map((a) => `<div class="ai"><b>${a.type}</b>: ${a.content}${a.rubricTag ? ` <span class="sub">(${a.rubricTag})</span>` : ""}</div>`).join("") || '<div class="empty">No action items.</div>';
    const tx = (r.transcript || []).map((u) => `<div class="tx"><span class="who">${u.speaker}</span> <span class="sub">${u.t}</span> — ${u.text}${u.classification ? ` <span class="sub">[${u.classification}]</span>` : ""}</div>`).join("") || '<div class="empty">No transcript.</div>';
    $("list-view").style.display = "none";
    const d = $("detail"); d.style.display = "block";
    d.innerHTML = `
      <div style="display:flex;align-items:center;gap:12px"><span class="back" id="back">← All crits</span><a class="back" id="dl" style="margin-left:auto">Download .json</a></div>
      <h1 style="margin:4px 0">${m.title || "Critique"}</h1>
      <div class="meta" style="margin-bottom:12px">${m.team ? m.team + " · " : ""}${m.library || ""} · invited: ${(m.invited || []).join(", ") || "—"} · spoke: ${(m.speakers || []).join(", ") || "—"}</div>
      <div class="panel"><h2>Critique quality</h2>${sc}</div>
      <div class="panel"><h2>Action items</h2>${ai}</div>
      <div class="panel"><h2>Transcript</h2>${tx}</div>`;
    $("back").onclick = () => { d.style.display = "none"; $("list-view").style.display = "block"; };
    $("dl").onclick = () => downloadJson(r);
    window.scrollTo(0, 0);
  }

  $("f-all").onclick = () => { filter = "all"; $("f-all").classList.add("on"); $("f-mine").classList.remove("on"); render(); };
  $("f-mine").onclick = () => { filter = "mine"; $("f-mine").classList.add("on"); $("f-all").classList.remove("on"); render(); };
  loadList();
</script>
</body>
</html>
