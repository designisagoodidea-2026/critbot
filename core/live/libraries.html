<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Critbot — Best Practices & Libraries</title>
<style>
  :root { font-family: Inter, -apple-system, system-ui, sans-serif; }
  body { margin: 0; background: #0f1115; color: #e8eaed; }
  .wrap { max-width: 1040px; margin: 0 auto; padding: 22px; }
  a { color: #6aa3f0; text-decoration: none; }
  header { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 6px; }
  h1 { font-size: 19px; margin: 0; }
  .sub { font-size: 12px; color: #8b93a3; margin-bottom: 20px; }
  h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: #8b93a3; margin: 26px 0 12px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 14px; }
  .card { background: #161922; border: 1px solid #232838; border-top: 3px solid #6aa3f0; border-radius: 12px; padding: 16px; }
  .card .name { font-size: 16px; font-weight: 600; }
  .pill { display: inline-block; font-size: 10px; text-transform: uppercase; letter-spacing: .05em; background: #1b2c46; color: #6aa3f0; border-radius: 5px; padding: 2px 7px; margin: 8px 0; }
  .desc { font-size: 13px; color: #c7ccd6; margin-bottom: 12px; line-height: 1.45; }
  .label { font-size: 10px; text-transform: uppercase; letter-spacing: .06em; color: #6f7787; margin: 12px 0 6px; }
  .g { font-size: 13px; color: #e8eaed; line-height: 1.5; display: flex; gap: 7px; padding: 2px 0; }
  .g .ck { color: #46c08a; }
  .dim { font-size: 12px; color: #c7ccd6; padding: 1px 0; }
  .stub { display: inline-block; font-size: 13px; color: #8b93a3; border: 1px dashed #2a2f3a; border-radius: 8px; padding: 7px 12px; margin: 0 8px 8px 0; }
  .panel { background: #161922; border: 1px solid #232838; border-radius: 12px; padding: 16px; }
  select, button { font: inherit; font-size: 13px; border-radius: 8px; border: 1px solid #2a2f3a; background: #1a1d24; color: #e8eaed; padding: 8px 12px; }
  button { cursor: pointer; }
  button.primary { background: #6aa3f0; border-color: #6aa3f0; color: #0f1115; font-weight: 600; }
  table { width: 100%; border-collapse: collapse; margin-top: 14px; }
  th, td { text-align: left; vertical-align: top; padding: 10px 12px; border-bottom: 1px solid #1c2130; font-size: 13px; }
  th { color: #8b93a3; font-weight: 500; font-size: 11px; text-transform: uppercase; letter-spacing: .05em; }
  td .aspect { color: #8b93a3; }
  .analysis { font-size: 14px; line-height: 1.6; color: #eef0f3; margin-top: 12px; white-space: pre-wrap; }
  .muted { color: #6f7787; font-size: 12px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Best Practices &amp; Library Management</h1>
    <a href="/live/">← Live Critique</a>
  </header>
  <div class="sub" id="brain">The lens the classifier, coach, and scorer run through.</div>

  <h2>Active libraries</h2>
  <div class="grid" id="active"></div>

  <h2>Other libraries</h2>
  <div id="stubs"></div>

  <h2>Library comparison</h2>
  <div class="panel">
    <div>
      <label class="muted">Compare
        <select id="cmpA"></select></label>
      <label class="muted"> with <select id="cmpB"></select></label>
      <button class="primary" id="analyze" style="margin-left:8px">✨ AI analysis of the difference</button>
    </div>
    <div class="analysis" id="analysis"></div>
    <table id="cmpTable"></table>
  </div>
</div>

<script>
let LIBS = [], LLM = false;
const $ = (id) => document.getElementById(id);
const byId = (id) => LIBS.find((l) => l.id === id);

async function init() {
  LLM = await fetch("/api/health").then((r) => r.json()).then((j) => j.llm).catch(() => false);
  LIBS = (await fetch("/api/libraries").then((r) => r.json())).libraries || [];
  $("brain").textContent = "The lens the classifier, coach, and scorer run through" + (LLM ? " · AI analysis available" : " · AI analysis off (no Anthropic key)");

  const active = LIBS.filter((l) => l.status !== "stub");
  const stubs = LIBS.filter((l) => l.status === "stub");

  $("active").innerHTML = active.map(cardHtml).join("");
  $("stubs").innerHTML = stubs.map((l) => `<span class="stub">${l.name} <span class="muted">· ${l.description.replace(/\s*\(stub.*$/, "")}</span></span>`).join("") || '<span class="muted">None.</span>';

  const opts = active.map((l) => `<option value="${l.id}">${l.name}</option>`).join("");
  $("cmpA").innerHTML = opts; $("cmpB").innerHTML = opts;
  if (active[1]) $("cmpB").value = active[1].id;
  $("cmpA").onchange = renderCompare; $("cmpB").onchange = renderCompare;
  $("analyze").onclick = runAnalysis;
  renderCompare();
}

function cardHtml(l) {
  const g = (l.guidelines || []).map((x) => `<div class="g"><span class="ck">✓</span><span>${x.label}</span></div>`).join("");
  const dims = (l.scoring || []).map((d) => `<div class="dim">• ${d.label}</div>`).join("");
  return `<div class="card">
    <div class="name">${l.name}</div>
    <div class="pill">${l.domain}</div>
    <div class="desc">${l.description}</div>
    <div class="label">Guidelines</div>${g}
    <div class="label">Scorecard dimensions</div>${dims}
    <div class="label">Coaching cues</div><div class="dim">${(l.coachingCues || []).length} live nudges</div>
  </div>`;
}

function renderCompare() {
  const a = byId($("cmpA").value), b = byId($("cmpB").value);
  if (!a || !b) return;
  const row = (aspect, av, bv) => `<tr><td class="aspect">${aspect}</td><td>${av}</td><td>${bv}</td></tr>`;
  const list = (l, key, field) => (l[key] || []).map((x) => x[field] || x.label).join("<br>") || "—";
  $("cmpTable").innerHTML =
    `<tr><th>Aspect</th><th>${a.name}</th><th>${b.name}</th></tr>` +
    row("Domain", a.domain, b.domain) +
    row("Focus", a.description, b.description) +
    row("Starting point", (a.guidelines[0] || {}).label || "—", (b.guidelines[0] || {}).label || "—") +
    row("Guidelines", list(a, "guidelines", "label"), list(b, "guidelines", "label")) +
    row("Scorecard", list(a, "scoring", "label"), list(b, "scoring", "label")) +
    row("Coaching cues", (a.coachingCues || []).length, (b.coachingCues || []).length);
}

async function runAnalysis() {
  const a = byId($("cmpA").value), b = byId($("cmpB").value);
  const out = $("analysis");
  if (LLM) {
    out.textContent = "Analyzing…";
    const r = await fetch("/api/library-analysis", {
      method: "POST", headers: { "content-type": "application/json" },
      body: JSON.stringify({ ids: [a.id, b.id] })
    }).then((x) => x.json()).catch(() => ({}));
    if (r && r.analysis) { out.textContent = r.analysis; return; }
  }
  // data-driven fallback (no key, or call failed)
  out.textContent =
    `${a.name} centers on ${a.domain.toLowerCase()} — ${a.description.toLowerCase()} — opening from "${(a.guidelines[0]||{}).label||""}". ` +
    `${b.name} centers on ${b.domain.toLowerCase()} — ${b.description.toLowerCase()} — opening from "${(b.guidelines[0]||{}).label||""}". ` +
    `Reach for ${a.name} when the work lives or dies on ${a.domain.toLowerCase()}; reach for ${b.name} when ${b.domain.toLowerCase()} is the bar.` +
    (LLM ? "" : "  (Add an Anthropic key for an AI-written comparison.)");
}

init();
</script>
</body>
</html>
