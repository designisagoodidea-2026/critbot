<!-- ui.html — Critbot Figma plugin, UI / IFRAME CONTEXT
     Normal HTML/CSS/JS. Has the DOM, does NOT have the `figma` API.
     Talks to code.js only via postMessage:
       to sandbox  : parent.postMessage({ pluginMessage: msg }, "*")
       from sandbox : window.onmessage = (e) => e.data.pluginMessage
     This is the REVIEW SINK: it loads a crit record exported by the live app
     (M4 record.json) and renders the action-item queue, with the M7 role/weight
     provenance when present. It cannot capture audio — that's the desktop app. -->
<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<style>
  :root { font-family: Inter, -apple-system, system-ui, sans-serif; }
  body { margin: 0; padding: 12px; color: #1a1a1a; }
  header { margin-bottom: 8px; }
  h1 { font-size: 13px; margin: 0; }
  .sub { font-size: 11px; color: #888; margin-top: 2px; }
  .score { font-size: 11px; color: #2e7d57; margin-top: 2px; }
  .loadbar { display: flex; align-items: center; gap: 8px; margin: 8px 0 12px; }
  .loadbar label { font-size: 11px; color: #2c6cd6; cursor: pointer; text-decoration: underline; }
  .loadbar input { display: none; }
  .relnotes { font-size: 11px; color: #555; background: #f6f7f9; border-left: 3px solid #c9ced6; padding: 7px 9px; border-radius: 4px; margin-bottom: 10px; }
  .item { border: 1px solid #e6e6e6; border-radius: 8px; padding: 10px; margin-bottom: 8px; }
  .item.done { opacity: 0.5; }
  .row { display: flex; flex-wrap: wrap; align-items: center; gap: 5px; margin-bottom: 6px; }
  .tag { font-size: 10px; padding: 2px 6px; border-radius: 4px; background: #f0f0f0; color: #555; }
  .tag.concern { background: #fdecec; color: #c0392b; }
  .tag.suggestion { background: #eef4fd; color: #2c6cd6; }
  .tag.decision { background: #fff4e0; color: #b06a14; }
  .tag.role { background: #efeaff; color: #6a4bb0; }
  .tag.wt { background: #eaf3ff; color: #2c6cd6; }
  .tag.protect { background: #e7f6ee; color: #2e7d57; }
  .content { font-size: 12px; line-height: 1.4; margin: 4px 0 8px; }
  .meta { font-size: 10px; color: #999; }
  .actions { display: flex; gap: 6px; margin-top: 8px; }
  button { font-size: 11px; padding: 4px 8px; border: 1px solid #d0d0d0; border-radius: 6px; background: #fff; cursor: pointer; }
  button.primary { background: #1a1a1a; color: #fff; border-color: #1a1a1a; }
  #empty { font-size: 12px; color: #999; padding: 20px 0; text-align: center; }
</style>
</head>
<body>
  <header>
    <h1 id="title">Crit Review</h1>
    <div class="sub" id="sub"></div>
    <div class="score" id="score"></div>
  </header>
  <div class="loadbar">
    <label for="file">Load crit record (.json)…</label>
    <input type="file" id="file" accept=".json,application/json" />
    <span class="sub" id="count"></span>
  </div>
  <div class="relnotes" id="relnotes" style="display:none"></div>
  <div id="queue"></div>
  <div id="empty" style="display:none">No action items in this crit. Load a record to review.</div>

<script>
  let current = null;
  function send(msg) { parent.postMessage({ pluginMessage: msg }, "*"); }
  function $(id) { return document.getElementById(id); }
  function badge(text, cls) { return `<span class="tag ${cls || ""}">${text}</span>`; }

  function renderRecord(rec) {
    current = rec;
    const meta = rec.meta || {};
    $("title").textContent = meta.title || "Crit Review";
    const sub = [];
    if (meta.library) sub.push("Lens: " + meta.library);
    if ((meta.invited || []).length) sub.push(meta.invited.length + " invited");
    if ((meta.speakers || []).length) sub.push(meta.speakers.length + " spoke");
    $("sub").textContent = sub.join(" · ");
    const sc = rec.scorecard || [];
    $("score").textContent = sc.length ? "Quality: " + sc.filter((s) => s.met).length + "/" + sc.length + " met" : "";

    const rel = rec.relationshipSummary;
    $("relnotes").textContent = rel ? rel.note : "";
    $("relnotes").style.display = rel ? "block" : "none";

    const items = rec.actionItems || [];
    const root = $("queue"); root.innerHTML = "";
    $("count").textContent = items.length + " action items";
    $("empty").style.display = items.length ? "none" : "block";

    items.forEach((item) => {
      const el = document.createElement("div");
      el.className = "item" + (item.status === "resolved" ? " done" : "");
      const tags = [badge(item.type, item.type)];
      if (item.rubricTag) tags.push(badge(item.rubricTag));
      if (item.scope && item.scope.length) tags.push(badge(item.scope.join(", ")));
      const p = item.provenance;
      if (p && p.relationship && p.relationship !== "unknown") {
        tags.push(badge(p.role || p.relationship, "role"));
        if (item.weight != null) tags.push(badge("×" + item.weight, "wt"));
        if (item.promotedToDecision) tags.push(badge("decision", "decision"));
      }
      if ((item.flags || []).indexOf("junior-point-protect") !== -1) tags.push(badge("protect", "protect"));
      const a = item.transcriptAnchor || {};
      const anchor = (a.speaker || "") + (a.t ? " · " + a.t : "");
      el.innerHTML =
        `<div class="row">${tags.join("")}</div>` +
        `<div class="content">${item.content || ""}</div>` +
        `<div class="meta">${anchor}</div>` +
        `<div class="actions">` +
        `<button data-act="focus">Focus frame</button>` +
        `<button data-act="toggle" class="primary">${item.status === "resolved" ? "Reopen" : "Resolve"}</button>` +
        `</div>`;
      el.querySelector('[data-act="focus"]').onclick = () => send({ kind: "focus-targets", id: item.id, targets: item.targets || [] });
      el.querySelector('[data-act="toggle"]').onclick = () => {
        item.status = item.status === "resolved" ? "open" : "resolved";
        send({ kind: "status-change", id: item.id, status: item.status });
        renderRecord(current);
      };
      root.appendChild(el);
    });
  }

  // Load an exported crit record from disk (record.json — or {record} wrapper).
  $("file").onchange = (e) => {
    const f = e.target.files[0]; if (!f) return;
    const r = new FileReader();
    r.onload = () => {
      try { const j = JSON.parse(r.result); renderRecord(j.record || j); send({ kind: "record-loaded" }); }
      catch (err) { alert("Couldn't parse that file as a Critbot crit record JSON."); }
    };
    r.readAsText(f);
  };

  window.onmessage = (e) => {
    const msg = e.data.pluginMessage; if (!msg) return;
    if (msg.kind === "load-queue") renderRecord({ meta: { title: "Sample crit (load a record to replace)" }, actionItems: msg.queue });
  };
</script>
</body>
</html>
